name: OZ contract tests

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oz-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vault
            package: examples/pausable/vault-test
            pattern: test_
            npm_script: test
            dar_env: OZ_VAULT_DAR
            dar: .upstream/examples/pausable/vault/.daml/dist/pausable-vault-example-0.0.0.dar
          - suite: token
            package: test/token-cip112-v1-test
            pattern: sandboxMintAndQuery
            npm_script: test:token
            dar_env: OZ_TOKEN_DAR
            dar: .upstream/packages/token/token-cip112-v1/.daml/dist/openzeppelin-token-cip112-v1-0.1.0.dar
          - suite: token-utils
            package: test/token-cip112-utils-test
            pattern: test
            npm_script: test:token-utils
            dar_env: OZ_TOKEN_UTILS_DAR
            dar: .upstream/test/token-cip112-utils-test/.daml/dist/openzeppelin-token-cip112-utils-test-0.0.0.dar
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      REPORT_DIR: ${{ github.workspace }}/.reports/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned OpenZeppelin contracts
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenZeppelin/canton-contracts
          ref: 1899f7a4326c9e1b6b76cb434e490e2e82331d9c
          path: .upstream
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.10.0"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare reports
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          echo "DPM_HOME=$RUNNER_TEMP/dpm" >> "$GITHUB_ENV"
          git -C .upstream rev-parse HEAD | tee "$REPORT_DIR/upstream-commit.txt"
      - name: Install DPM, SDK 3.5.8 and Canton 3.5.6
        working-directory: .upstream
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          curl --fail --location --retry 3 \
            https://get.digitalasset.com/install/dpm-sdk/dpm-3.5.8-linux-amd64.tar.gz \
            --output "$install_dir/sdk.tar.gz"
          mkdir "$install_dir/sdk"
          tar -xzf "$install_dir/sdk.tar.gz" -C "$install_dir/sdk" --strip-components=1
          "$install_dir/sdk/bin/dpm" bootstrap "$install_dir/sdk"
          export PATH="$DPM_HOME/bin:$PATH"
          echo "$DPM_HOME/bin" >> "$GITHUB_PATH"
          dpm install
          mkdir "$install_dir/runtime"
          printf 'components:\n  - canton-open-source:3.5.6\n' > "$install_dir/runtime/daml.yaml"
          (cd "$install_dir/runtime" && dpm install package)
      - name: Record toolchain versions
        working-directory: .upstream
        run: |
          set -euo pipefail
          {
            node --version
            npm --version
            java -version
            dpm --version
            dpm version
          } 2>&1 | tee "$REPORT_DIR/toolchain.log"
      - name: Build the selected original suite and its dependencies
        working-directory: .upstream
        env:
          DAML_PACKAGE: ${{ matrix.package }}
          DAR_ENV: ${{ matrix.dar_env }}
          DAR_PATH: ${{ github.workspace }}/${{ matrix.dar }}
        run: |
          set -euo pipefail
          dpm build 2>&1 | tee "$REPORT_DIR/build.log"
          test -f "$DAR_PATH" || { printf 'Missing built DAR: %s\n' "$DAR_PATH" >&2; exit 1; }
          printf '%s=%s\n' "$DAR_ENV" "$DAR_PATH" >> "$GITHUB_ENV"
      - name: Original Daml baseline (in memory)
        working-directory: .upstream
        env:
          DAML_PACKAGE: ${{ matrix.package }}
          TEST_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          dpm test --test-pattern "$TEST_PATTERN" \
            --junit "$REPORT_DIR/original.xml" 2>&1 | tee "$REPORT_DIR/original.log"
      - run: npm ci
      - name: Run the STL port on a real open Sandbox
        env:
          NPM_SCRIPT: ${{ matrix.npm_script }}
        run: |
          set -euo pipefail
          npm run "$NPM_SCRIPT" 2>&1 | tee "$REPORT_DIR/stl.log"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: oz-${{ matrix.suite }}-test
          path: ${{ env.REPORT_DIR }}/
          include-hidden-files: true
          if-no-files-found: warn
